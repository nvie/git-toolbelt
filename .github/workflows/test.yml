name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats bubblewrap
          # Ubuntu's AppArmor policy blocks the unprivileged user namespaces
          # that bwrap needs to set up the test sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core coreutils

      - run: make test
